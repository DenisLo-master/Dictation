name: Build installer

on:
  push:
    branches:
      - main
    paths-ignore:
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Build DMG and PKG
        run: Scripts/build-dmg.sh

      - name: Commit installer artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/Dictation.pkg build/Dictation.dmg
          if git diff --cached --quiet; then
            echo "Installer artifacts are unchanged."
            exit 0
          fi
          git commit -m "Build Dictation installer [skip ci]"
          git push
